minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
        args:
          - --config=.gitleaks.toml
          - --gitleaks-ignore-path=.gitleaksignore
          - --ignore-gitleaks-allow
          - --max-decode-depth=5
