name: secret-scan

on:
  pull_request:
  push:
    # 기본 브랜치만 지정한다. 특정하지 않으면 모든 push 이벤트에서 전체 이력을 매번 재검사해 느려진다.
    branches: ["master"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # pull_request 는 PR 번호로, push/merge_group 은 github.ref(브랜치·머지 큐 그룹 ref)로 묶는다.
  # merge_group 페이로드의 하위 필드 이름은 공식 문서에서 확인하지 못해 확실한 github.ref 만 쓴다.
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    # 조직/러너 그룹에 맞는 runs-on 으로 바꾼다.
    runs-on: default-29cm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out full history
        # 검증: actions/checkout v7.0.1 = 3d3c42e5aac5ba805825da76410c181273ba90b1
        # (gh api repos/actions/checkout/git/refs/tags/v7.0.1 로 조회)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1 (checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # 검증: 공식 릴리스의 gitleaks_8.30.1_checksums.txt 에서 그대로 옮겼다.
          # 이 값은 linux_x64 자산의 것이다 (default-29cm 은 x86_64). 러너 아키텍처가 바뀌면
          # 아래 다운로드 URL 의 자산명과 이 체크섬을 checksums.txt 의 해당 항목(예: linux_arm64)으로 함께 바꾼다.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 120 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Verify checkout integrity and required policy files
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "::error::shallow checkout — fetch-depth: 0 이 적용되지 않았다. 전체 이력 검사를 신뢰할 수 없다."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo "::error::checkout HEAD($(git rev-parse HEAD))가 검사 대상 커밋($TARGET_SHA)과 다르다."
            exit 1
          fi
          if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            echo "::error::검사 대상 커밋 $TARGET_SHA 를 checkout 에서 찾을 수 없다. fetch 가 불완전하다."
            exit 1
          fi
          for policy_path in .gitleaks.toml .gitleaksignore; do
            if [[ -L "$policy_path" || ! -f "$policy_path" || ! -r "$policy_path" ]]; then
              echo "::error::필수 정책 파일 ${policy_path} 이 없거나 심볼릭 링크이거나 읽을 수 없다."
              exit 1
            fi
          done

      - name: Reject SHA-less .gitleaksignore entries
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r entry || [[ -n "$entry" ]]; do
            if [[ ! "$entry" =~ ^[[:space:]]*(#.*)?$ ]] \
               && [[ ! "$entry" =~ ^[[:space:]]*[0-9a-f]{40}:[^:]+:[^:]+:[0-9]+[[:space:]]*$ ]]; then
              echo "::error::.gitleaksignore 항목은 <40자리 commit sha>:파일:규칙:줄 형태의 커밋별 Fingerprint 전체여야 한다. 잘못된 항목: ${entry}"
              fail=1
            fi
          done < .gitleaksignore
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::커밋 SHA 없는 전역 file:rule:line 예외는 이후에 같은 위치에 들어오는 실제 비밀값까지 가리므로 받지 않는다."
            exit 1
          fi

      - name: Set up git failure shim
        # gitleaks 8.30.1 은 내부 git 호출이 stderr 만 내고 죽어도 종료 코드 0, "no leaks found"
        # 로 끝낸다(gitleaks 자체 버그). git 을 감싸 비정상
        # 종료를 항상 stderr 로 표시하고, 이후 단계에서 그 표식을 검사해 실패로 바꾼다.
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/git-shim"
          mkdir -p "$shim_dir"
          git_path="$(command -v git)"
          cat > "$shim_dir/git" <<SHIM
          #!/usr/bin/env bash
          "$git_path" "\$@"
          status=\$?
          if [[ \$status -ne 0 ]]; then
            echo "SHIM: git exited with status \$status (args: \$*)" >&2
          fi
          exit \$status
          SHIM
          chmod +x "$shim_dir/git"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: Scan full history (remerge)
        id: scan_remerge
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gitleaks-remerge.log"
          report="$RUNNER_TEMP/gitleaks-remerge-report.json"
          set +e
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="--diff-merges=remerge ${TARGET_SHA}" \
            --config=.gitleaks.toml \
            --gitleaks-ignore-path=.gitleaksignore \
            --ignore-gitleaks-allow \
            --max-decode-depth=5 \
            --redact=100 \
            --no-banner --no-color --verbose \
            --report-format=json --report-path="$report" \
            2>&1 | tee "$log"
          scan_rc=${PIPESTATUS[0]}
          set -e
          if grep -q 'SHIM: git exited with status' "$log"; then
            echo "::error::remerge 검사 중 git 이 실패했다. 검사 결과를 신뢰할 수 없다."
            exit 1
          fi
          if grep -qE '^\S+\s+ERR\s' "$log"; then
            echo "::error::remerge 검사 중 gitleaks 가 ERR 로그를 남겼다. 검사 결과를 신뢰할 수 없다."
            exit 1
          fi
          if [[ ! -f "$report" ]]; then
            echo "::error::remerge 검사 리포트 파일이 생성되지 않았다. 정상 종료로 취급하지 않는다."
            exit 1
          fi
          exit "$scan_rc"

      - name: Scan octopus merges (first-parent supplement)
        # --diff-merges=remerge 는 부모가 3개 이상인 octopus 병합을 조용히 건너뛴다(gitleaks
        # 자체 동작). first-parent 로 그 커밋 하나씩만 다시 훑어
        # merge 가 들여온 전체 변경을 잡는다.
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          overall_rc=0
          octopus_count=0
          while IFS= read -r oc || [[ -n "$oc" ]]; do
            [[ -z "$oc" ]] && continue
            octopus_count=$((octopus_count + 1))
            log="$RUNNER_TEMP/gitleaks-octopus-${oc}.log"
            report="$RUNNER_TEMP/gitleaks-octopus-${oc}-report.json"
            set +e
            "$RUNNER_TEMP/gitleaks" git . \
              --log-opts="--diff-merges=first-parent -1 ${oc}" \
              --config=.gitleaks.toml \
              --gitleaks-ignore-path=.gitleaksignore \
              --ignore-gitleaks-allow \
              --max-decode-depth=5 \
              --redact=100 \
              --no-banner --no-color --verbose \
              --report-format=json --report-path="$report" \
              2>&1 | tee "$log"
            scan_rc=${PIPESTATUS[0]}
            set -e
            if grep -q 'SHIM: git exited with status' "$log"; then
              echo "::error::octopus 병합 $oc 검사 중 git 이 실패했다. 검사 결과를 신뢰할 수 없다."
              overall_rc=1
            fi
            if grep -qE '^\S+\s+ERR\s' "$log"; then
              echo "::error::octopus 병합 $oc 검사 중 gitleaks 가 ERR 로그를 남겼다. 검사 결과를 신뢰할 수 없다."
              overall_rc=1
            fi
            if [[ ! -f "$report" ]]; then
              echo "::error::octopus 병합 $oc 검사 리포트 파일이 생성되지 않았다."
              overall_rc=1
            fi
            if [[ "$scan_rc" -ne 0 ]]; then
              overall_rc=1
            fi
          done < <(git rev-list --min-parents=3 "$TARGET_SHA")
          echo "octopus 병합 개수: ${octopus_count}"
          exit "$overall_rc"
